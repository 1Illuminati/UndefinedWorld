# ============================================================
# UndefinedWorld 테스트 아이템 정의 (Nexo items 폴더용)
# plugins/Nexo/items/ 에 이 파일이 자동 복사된다 (없을 때만).
# 테스트 흐름:
#   1. /ugive <아이템ID> 로 지급
#   2. /skillcraft <이름> → 기어 배치 → 확인
#   3. /skill equip RIGHT_CLICK <이름>
#   4. 무기(test_sword 등) 들고 우클릭
# ============================================================

# ── 무기 (스킬 발동에 필요) ─────────────────────────────
test_sword:
  itemname: "테스트 검"
  material: IRON_SWORD
  Mechanics:
    u_item:
      type: WEAPON
      grade: NORMAL
      slot: SWORD
      damage: 10
      attributes:
        PHYSICS_DAMAGE: 5

